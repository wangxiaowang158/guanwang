# 安全响应头 —— admin 与 web 两个 server 块共用
#
# 为什么抽成单独文件按需 include，而不是只在 server 级写一遍：
# nginx 的 add_header 不是累加继承——某个 location 里只要出现一条自己的
# add_header，该 location 就完全不再继承上层的 add_header。本仓 /assets/
# 带 Cache-Control，/uploads/ 与 /api/ 走反代，若只在 server 级写，
# 这些路径下的安全头会静默消失。故每个写了 add_header 的 location 都得再 include 一次。
#
# always 参数：默认 add_header 只对 2xx/3xx 生效，
# 加 always 后 4xx/5xx 也带上——错误页同样可能被用来做点击劫持与嗅探。

# 禁止浏览器按内容猜测 MIME：上传目录直出用户文件，
# 猜测会把伪装成图片的 HTML 当页面执行
add_header X-Content-Type-Options "nosniff" always;

# 禁止被任何站点用 frame 套壳，防点击劫持。
# CSP 的 frame-ancestors 是同一件事的现代写法，两者都发以覆盖旧浏览器
add_header X-Frame-Options "DENY" always;

# 跨站跳转时只发送来源域名，不带完整路径与查询串
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 本站不用摄像头/麦克风/定位，显式关掉，第三方内容也无法申请
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS 只在请求确实经 HTTPS 进来时才发（$hsts_value 由 gateway.conf 的 map 决定）。
# 本容器监听的是明文 HTTP，HTTPS 在宿主机宝塔那层终结；
# 若无条件下发，一旦站点尚未配好证书，浏览器会记住"只走 HTTPS"而打不开站点。
# add_header 的值为空串时 nginx 不输出该头，正好用作开关
add_header Strict-Transport-Security $hsts_value always;

# CSP —— 两端都是同源部署，构建产物为外链 module 脚本，无需给脚本开任何白名单
#   script-src 'self'：杜绝内联与外站脚本，XSS 最主要的落地方式
#   style-src 含 'unsafe-inline'：Vue 的 :style 绑定与 element-plus /
#     ant-design-vue 运行时注入样式都是内联，去掉会让两端样式大面积失效
#   img-src 含 data: 与 blob:：栏目头图种子是 data:image/svg+xml，
#     后台导出与预览走 blob:
#   media-src 含 blob:：上传的视频经 <video> 播放
#   object-src 'none' / base-uri 'self' / form-action 'self'：
#     分别封掉插件、<base> 劫持与表单外发
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
