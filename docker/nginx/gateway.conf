# 网关站点配置 —— 每个前端一个 server 块，按端口区分，不依赖域名
# 域名只在宿主机宝塔那层配置，以后换域名不用动本文件

# backend 走 Docker 内部 DNS，服务名即主机名；resolver 不需要额外配置
upstream zrh_backend {
    server backend:3000;
    keepalive 16;
}

# 通用反代头，两个 server 块共用
# X-Forwarded-Proto 取宝塔传进来的值，缺失时回退 $scheme，
# 使后端在 HTTPS 场景下能拿到正确协议
map $http_x_forwarded_proto $fwd_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# HSTS 的取值开关：仅当请求确实经 HTTPS 进来时才给出实际值，否则留空。
# 本容器监听明文 HTTP，证书在宿主机宝塔那层，故不能无条件下发——
# 站点还没配证书时下发 HSTS 会让浏览器记住"只走 HTTPS"，直接打不开。
# 值为空串时 add_header 不输出该头，见 security-headers.conf
map $fwd_proto $hsts_value {
    "https" "max-age=31536000; includeSubDomains";
    default "";
}

# ---------- 8080：admin 管理后台 ----------
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html/admin;
    index index.html;

    # 上传体积上限：须覆盖后端 UPLOAD_VIDEO_MAX_MB（默认 100MB）并留出余量，
    # 否则视频在网关就被 413 拦掉，压根到不了后端
    client_max_body_size 110m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    include /etc/nginx/snippets/security-headers.conf;

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 本 location 自带 add_header，故不再继承 server 级的安全头，须再引一次
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 上传文件由后端静态托管，路径不在 /api/ 之下，须单独反代
    # 本 location 不写 add_header，故继承 server 级的安全头；
    # 后端自己也发一份（直连场景需要），这里剥掉以免同名头重复下发
    location /uploads/ {
        proxy_pass http://zrh_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        include /etc/nginx/snippets/hide-upstream-security-headers.conf;
    }

    # 接口反代给后端容器；管理端 /api/mgmt/* 靠此穿透
    location /api/ {
        proxy_pass http://zrh_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/hide-upstream-security-headers.conf;
    }

    # index.html 引用带 hash 的产物，发版后旧 hash 文件已不存在，
    # 浏览器若缓存了旧 index.html 就会去取已删除的 chunk —— 白屏。故禁止缓存
    location = /index.html {
        add_header Cache-Control "no-store" always;
        # 本 location 写了 add_header，故不再继承 server 级的安全头，须再引一次
        include /etc/nginx/snippets/security-headers.conf;
    }

    # history 路由回退：刷新子页面时交还 index.html，否则 404。
    # 回退是内部跳转，会命中上面的 location = /index.html，同样不缓存
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 8081：web 官网前台 ----------
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html/web;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    # 含 xml：sitemap.xml 随内容增长，压缩后对爬虫抓取更友好
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 1k;

    include /etc/nginx/snippets/security-headers.conf;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 本 location 自带 add_header，故不再继承 server 级的安全头，须再引一次
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 上传文件由后端静态托管，路径不在 /api/ 之下，须单独反代
    location /uploads/ {
        proxy_pass http://zrh_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        include /etc/nginx/snippets/hide-upstream-security-headers.conf;
    }

    # 前台接口全部走 /api/portal/*
    location /api/ {
        proxy_pass http://zrh_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/hide-upstream-security-headers.conf;
    }

    # 站点地图与爬虫协议：搜索引擎只认站点根下的这两个路径，
    # 但内容依赖库里的域名配置，故由后端动态生成后映射到根。
    # 精确匹配（=）优先级高于下方的 location /，不会被 SPA 回退吃掉。
    location = /sitemap.xml {
        proxy_pass http://zrh_backend/api/portal/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        include /etc/nginx/snippets/hide-upstream-security-headers.conf;
    }

    location = /robots.txt {
        proxy_pass http://zrh_backend/api/portal/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        include /etc/nginx/snippets/hide-upstream-security-headers.conf;
    }

    # ---------- 首屏预渲染 ----------
    # web 是纯客户端渲染，index.html 里 #app 是空的。Googlebot 会执行 JS 拿得到内容，
    # 但百度、社交平台抓取、各类无头爬虫多数不执行，它们看到的是一个没有正文的空壳。
    # 这里用 SSI 把后端按路径生成的语义 HTML 片段拼进 #app，Vue 挂载时会将其清掉。
    #
    # 为什么由网关而非后端拼：dist 在本容器里，后端容器访问不到 index.html；
    # 反过来内容全在库里，网关也生不出片段。SSI 正好把两边接起来。
    #
    # 为什么收口到精确 location 而非写在 location / ：
    # ssi on 会让该 location 下所有 text/html 响应都被扫一遍 SSI 指令，
    # 而下面的 no-store 更不该落到 favicon.svg / icons.svg 上。
    # SPA 的 HTML 出口只有 index.html 一个 —— 已知路由 try_files 末位回退、
    # 软 404 的 error_page、首页的 rewrite 都是内部跳转，会重新匹配到这里，故收口在此足够。
    # 注意 try_files 只有「末位参数」才是内部跳转，非末位命中是在原 location 直接出文件
    location = /index.html {
        ssi on;
        # 只压制 SSI 自身的错误提示；后端错误页正文由下面的 proxy_intercept_errors 挡
        ssi_silent_errors on;

        # 兜底注入：若构建工具把 index.html 里那条 SSI 注释剥掉了，
        # 由 sub_filter 在响应流里补回来。nginx 过滤器链中 sub_filter 早于 ssi 执行，
        # 补进去的指令仍会被 SSI 处理。两条互斥 —— 注释在就匹配不到裸 div
        sub_filter '<div id="app"></div>' '<div id="app"><!--# include virtual="/__prerender?path=$request_uri" --></div>';
        sub_filter_once on;

        # SPA 的 index.html 必须每次回源取完整响应：
        # 所有路径共用同一个物理文件，ETag / Last-Modified 也就完全相同，
        # 内容在后台改过但文件没动时，条件请求会拿到 304，
        # 于是抓取方复用的是上一版片段 —— 页面看着正常，SEO 内容是旧的
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store" always;
        # 本 location 写了 add_header，故不再继承 server 级的安全头，须再引一次
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 预渲染片段的取数出口，仅供上面的 SSI 子请求使用。
    # internal 使其对浏览器直接访问返回 404 —— 它不是对外接口；
    # 且若没有这条 location，该路径会掉进下面的 SPA 回退，
    # 让 index.html 把自己递归包进自己（实测确认）
    location = /__prerender {
        internal;
        proxy_pass http://zrh_backend/api/portal/prerender?path=$arg_path;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # 原始地址另经请求头传一份：?path=$request_uri 拼进查询串后，路径里未编码的 & 会把
        # $arg_path 截断（/about&x 被当成 /about，给不存在的地址输出 about 页内容，实测确认）。
        # 子请求里的 $request_uri 取的是主请求的原始地址，后端优先读此头
        proxy_set_header X-Prerender-Path $request_uri;
        # 片段是可选增强，后端慢不能把整页拖住
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        # 后端 5xx 时若不拦，nginx 会把「502 Bad Gateway」那页 HTML 原样
        # 拼进 <div id="app"> —— 用户会看见一块错误页（实测确认，
        # ssi_silent_errors 管不了这个，它只压制 SSI 自身的提示）
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @empty_fragment;
    }

    # 预渲染 <head> 片段的取数出口，供 index.html 里 <head> 的 SSI include 使用。
    # index.html 里的写法（由 web 维护）：
    #   <!--# block name="default_head" -->…默认 title/meta…<!--# endblock -->
    #   <!--# include virtual="/__prerender_head?path=$request_uri" stub="default_head" -->
    #
    # SSI stub 的语义：子请求**响应体为空**时（或 SSI 处理出错时）才用 stub 顶上，
    # 与子请求的状态码无关——非 2xx 但带正文的响应，其正文照样会被拼进页面。
    # 所以这里不能让后端错误原样透传成 502：nginx 自带的「502 Bad Gateway」错误页正文
    # 会被拼进 <head>（与上面 /__prerender 注释里实测到的现象同理），stub 反而不生效。
    # 正确做法是和 /__prerender 一样拦截错误并以空正文收场，空正文正是触发 stub 的条件。
    #
    # 后端的约定：正常情况永远返回完整 head（非法/不存在路径给站点默认值 + noindex），
    # 只有后端异常/超时/不可达才落到 @empty_fragment → 空正文 → stub 里的默认 head
    location = /__prerender_head {
        internal;
        proxy_pass http://zrh_backend/api/portal/prerender/head?path=$arg_path;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # 同 /__prerender：原始地址走请求头，避免 & 截断
        proxy_set_header X-Prerender-Path $request_uri;
        # head 与正文片段同为可选增强，后端慢不能把整页拖住；超时同样走空正文 → stub
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @empty_fragment;
    }

    # 片段取不到时以空内容收场：#app 退回为空的现状；<head> 则因正文为空触发 SSI stub，
    # 用回 index.html 里的默认 head。页面照常可用
    location @empty_fragment {
        return 200 "";
    }

    # ---------- 已知前台路由 ----------
    # 注意：新增前台路由必须同步此正则（对照 web/src/router/index.ts），
    # 否则该地址会被下面的 location / 当作未知路径返回 404 状态码——
    # 页面仍能正常渲染（SPA 照常接管），但搜索引擎会把它当成不存在的页面不予收录。
    # 允许尾斜杠；查询串不参与 location 匹配，天然放行。
    # 命中后回退到 index.html，由 location = /index.html 做 SSI 注入，状态码 200
    # ~* 不区分大小写：vue-router 默认不区分，/HVAC 前台照常渲染，网关也不该回 404
    location ~* ^/(?:hvac|energy|smart|household|case|news|alliance|about|privacy|article/[0-9]+|member/(?:center|login|register|forgot))/?$ {
        try_files $uri /index.html;
    }

    # 首页单独精确匹配：/ 不在上面的正则里，也不该走下面的 404 分支。
    # 必须用 rewrite ... last 做内部跳转：try_files 若以存在的文件作非末位参数命中，
    # 只在当前 location 里改写 URI 直接出文件，不会进 location = /index.html，
    # 首页就拿不到 SSI 注入与 no-store（实测确认）
    location = / {
        rewrite ^ /index.html last;
    }

    # 其余路径：真实存在的文件（favicon.svg 等）照常返回；
    # 不存在的一律软 404——状态码 404，正文仍是 index.html，由前台 404 页呈现。
    # error_page 放在本 location 内而非 server 级：/assets/ 下缺失的 chunk 要保持
    # 普通 404，若也回 index.html，浏览器会把 HTML 当 JS 解析报出更难排查的错。
    # 内部跳到 /index.html 仍会匹配 location = /index.html，SSI 照常注入；
    # 状态码保持 404（error_page 未写 =code 时沿用原状态码）。
    # SSI 与 sub_filter 过滤器不看状态码，404 响应同样会被处理
    location / {
        try_files $uri =404;
        error_page 404 /index.html;
    }
}
