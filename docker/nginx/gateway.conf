# 网关站点配置 —— 每个前端一个 server 块，按端口区分，不依赖域名
# 域名只在宿主机宝塔那层配置，以后换域名不用动本文件

# backend 走 Docker 内部 DNS，服务名即主机名；resolver 不需要额外配置
upstream zrh_backend {
    server backend:3000;
    keepalive 16;
}

# 通用反代头，两个 server 块共用
# X-Forwarded-Proto 取宝塔传进来的值，缺失时回退 $scheme，
# 使后端在 HTTPS 场景下能拿到正确协议
map $http_x_forwarded_proto $fwd_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# ---------- 8080：admin 管理后台 ----------
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html/admin;
    index index.html;

    # 上传体积上限，与 admin 的 VITE_UPLOAD_MAX_MB 留出余量
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 接口反代给后端容器；管理端 /api/mgmt/* 靠此穿透
    location /api/ {
        proxy_pass http://zrh_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    # history 路由回退：刷新子页面时交还 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 8081：web 官网前台 ----------
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html/web;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前台只用到 /api/portal/*，其余接口由浏览器端 Mock 提供
    location /api/ {
        proxy_pass http://zrh_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
