# 剥掉上游（backend）自行发出的安全响应头 —— 仅用于反代类 location
#
# 后端也装了一层安全头中间件，目的是不经网关直连时（本地开发、内网排障）
# 仍有基本防护。但经网关访问时两边都发就会出现同名头重复：
# 浏览器对重复 CSP 的处理是"各自独立执行、取交集"，两份策略稍有出入
# 就会出现只在生产复现、且报错指向不明的拦截。
#
# 故约定：网关在时以网关为准，把上游的同名头在此剥掉。
# 本文件只 hide 不 add——反代 location 不写 add_header，
# 才能继续继承 server 级的 security-headers.conf。
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
