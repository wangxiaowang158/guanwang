# 中瑞恒官网 —— 四容器编排：mysql / redis / backend / gateway
# 端口只绑 127.0.0.1，公网流量统一经宿主机宝塔 Nginx 反代进来
# 数据落在命名卷，容器重建不丢

# 容器日志轮转：json-file 默认不限大小，小内存机器上会把磁盘慢慢吃满。
# 每个容器最多保留 3 个 10MB 的文件
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: zrh-mysql
    restart: unless-stopped
    logging: *default-logging
    command:
      # utf8mb4 保证中文与 emoji 正常；后端实体用 datetime，时区统一为 UTC
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zrh_website}
      MYSQL_USER: ${MYSQL_USER:-zrh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env 中设置}
    ports:
      # 只绑回环，公网连不上；Navicat 等客户端经 SSH 隧道访问
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 用应用账号而非 root 探活，顺带验证授权是否正确
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "${MYSQL_USER:-zrh}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - zrh-net

  redis:
    image: redis:7-alpine
    container_name: zrh-redis
    restart: unless-stopped
    logging: *default-logging
    command:
      # 只存图形/短信验证码这类分钟级过期的临时键，重启丢了也只是让用户重取一次，
      # 故不开持久化（免去 AOF 落盘与 fork 开销）
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # 键有 TTL 会自然回收，上限只是兜底防内存失控；触顶时先淘汰将过期的键
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-ttl
    # 不映射端口：仅 backend 经内部网络访问，不对宿主机暴露
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - zrh-net

  backend:
    # 默认拉 GHCR 上由 CI 构建好的镜像；服务器不参与构建，2G 内存也够跑
    image: ghcr.io/${IMAGE_OWNER:-wangxiaowang158}/zrh-website-server:${IMAGE_TAG:-latest}
    # build 段保留：需要离线/本地构建时执行 docker compose up -d --build 即可回退
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: zrh-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-zrh}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-zrh_website}
      # 表结构一律走 TypeORM 迁移，不靠 synchronize。
      # 容器每次启动先自动执行迁移（见 docker/server-entrypoint.sh），
      # 全新库会建出完整结构并写入初始栏目与站点信息，无需手工操作。
      # 此处固定 false 且不给覆盖口子：synchronize 会按实体差异改线上表，删列即丢数据
      DB_SYNCHRONIZE: "false"
      JWT_MEMBER_SECRET: ${JWT_MEMBER_SECRET:?必须在 .env 中设置}
      JWT_MEMBER_EXPIRES_IN: ${JWT_MEMBER_EXPIRES_IN:-2h}
      # 管理员令牌密钥：必填。缺省会回落到源码内的开发默认值，令牌可被任意伪造
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?必须在 .env 中设置}
      JWT_ADMIN_EXPIRES_IN: ${JWT_ADMIN_EXPIRES_IN:-8h}
      # 首个管理员账号：仅在管理员表为空时创建，建成后改密码即与此处无关。
      # 密码留空时后端随机生成强口令，只在首次启动日志里出现一次：
      #   docker compose logs backend | grep 初始管理员
      ADMIN_SEED_ACCOUNT: ${ADMIN_SEED_ACCOUNT:-admin}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      # 上传目录：与下方 backend-uploads 卷的挂载点一致，容器重建不丢图
      UPLOAD_DIR: data/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-2}
      UPLOAD_VIDEO_MAX_MB: ${UPLOAD_VIDEO_MAX_MB:-100}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
      # 验证码存储指向上方 redis 服务。默认值写死 redis://redis:6379/0：
      # 这里若留空，验证码会退回进程内存，backend 重启即全部失效
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-zrh:}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-2000}
      # 留空即不启用跨域：两个前端都经 gateway 同源访问 /api，本就无跨域
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 新反馈群通知：留空即不推送，客户留言照常落库
      FEEDBACK_NOTIFY_WEBHOOK: ${FEEDBACK_NOTIFY_WEBHOOK:-}
      FEEDBACK_NOTIFY_TYPE: ${FEEDBACK_NOTIFY_TYPE:-wecom}
      FEEDBACK_NOTIFY_TIMEOUT_MS: ${FEEDBACK_NOTIFY_TIMEOUT_MS:-3000}
      # 封面「AI 生成」：密钥留空即关闭该功能，其余上传方式不受影响
      AI_IMAGE_BASE_URL: ${AI_IMAGE_BASE_URL:-https://api.openai.com/v1}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-gpt-image-1}
      AI_IMAGE_API_KEY: ${AI_IMAGE_API_KEY:-}
      AI_IMAGE_COUNT: ${AI_IMAGE_COUNT:-5}
      AI_IMAGE_SIZE: ${AI_IMAGE_SIZE:-1536x1024}
      AI_IMAGE_TIMEOUT_MS: ${AI_IMAGE_TIMEOUT_MS:-90000}
    volumes:
      # 后台上传的图片落在容器内，不挂卷则重建容器即全部丢失。
      # 路径须与上方 UPLOAD_DIR 一致（相对镜像 WORKDIR /app）
      - backend-uploads:/app/data/uploads
    networks:
      - zrh-net

  gateway:
    image: ghcr.io/${IMAGE_OWNER:-wangxiaowang158}/zrh-website-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: zrh-gateway
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 只监听回环地址，杜绝绕过宝塔直连容器
      - "127.0.0.1:8080:8080"   # admin 管理后台
      - "127.0.0.1:8081:8081"   # web  官网前台
    networks:
      - zrh-net

networks:
  zrh-net:
    driver: bridge

volumes:
  mysql-data:
  backend-uploads:
