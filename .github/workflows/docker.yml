name: Docker 镜像构建

# push 到 main 时自动构建两个镜像并推送到 GHCR，服务器只需 pull
# 与 ci.yml 分工：ci.yml 管类型检查与产物归档，本文件只管镜像
on:
  push:
    branches: [main]
    # 这些路径已被 .dockerignore 排除在构建上下文之外，改动它们不会影响镜像内容，
    # 故跳过构建省额度。需要强制重建时用 Actions 页的 Run workflow
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch: # 支持在 Actions 页面手动触发重建

# packages: write 用于推送镜像到 GHCR，由内置 GITHUB_TOKEN 提供，无需额外配 PAT
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端镜像（server）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR 要求镜像路径全小写，仓库归属方含大写字母时直接用会 400。
      # 用 tr 而非 bash 的 ${var,,}，不依赖 bash 版本
      - name: 计算镜像名
        id: img
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/zrh-website-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest 供日常发版，sha-<短哈希> 供回滚定位
      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  gateway:
    name: 网关镜像（gateway，含两个前端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名
        id: img
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/zrh-website-gateway" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # MGMT_DEV_TOKEN 是构建期写死进 admin 产物的，必须在此传入，
      # 且要与服务器 .env 里的同名值完全一致，否则管理端接口全部 401。
      # 缺失时不给默认值：宁可让构建失败，也不要产出一个静默 401 的镜像。
      - name: 校验 Secret 是否已配置
        run: |
          if [ -z "${{ secrets.MGMT_DEV_TOKEN }}" ]; then
            echo "::error::仓库 Secret MGMT_DEV_TOKEN 未配置，无法构建网关镜像"
            echo "配置路径：仓库 Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gateway.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_MGMT_DEV_TOKEN=${{ secrets.MGMT_DEV_TOKEN }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
